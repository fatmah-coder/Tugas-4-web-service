services:
  mariadb:
    image: mariadb:11
    container_name: wisataku-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: wisataku
      MARIADB_USER: wisata
      MARIADB_PASSWORD: wisata123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
